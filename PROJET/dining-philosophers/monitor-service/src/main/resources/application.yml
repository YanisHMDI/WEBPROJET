server:
  port: 8080

spring:
  application:
    name: monitor-service
  # partie 6 : utilisé seulement si monitor.kafka.enabled=true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: monitor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # un message illisible est écarté au lieu de bloquer la consommation
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: fr.cytech.hamoudilitim.philo.common.PhilosopherEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: fr.cytech.hamoudilitim.philo.common
    listener:
      auto-startup: ${monitor.kafka.enabled:false}

monitor:
  philosophers: 5
  detect-neighbour-conflicts: true
  max-events: 10000
  kafka:
    enabled: false
  # adresses des philosophes, pour le panneau de contrôle (démarrer / arrêter, jetons, calcul distribué)
  philosopher-urls: http://localhost:8090,http://localhost:8091,http://localhost:8092,http://localhost:8093,http://localhost:8094

management:
  endpoints:
    web:
      exposure:
        # partie 6 : santé (sondes Kubernetes) et métriques Prometheus
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness et /actuator/health/readiness
  metrics:
    tags:
      application: ${spring.application.name}
