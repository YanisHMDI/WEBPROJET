server:
  port: ${PHILO_PORT:8090}

spring:
  application:
    name: philosopher-service

philo:
  id: 0
  count: 5
  # SPOILED (partie 1) | NAIVE_SUPERVISOR (partie 2) | PAIR_SUPERVISOR (parties 3.1 / 3.2)
  mode: SPOILED
  think-min: 500ms
  think-max: 2s
  eat-min: 500ms
  eat-max: 2s
  retry-delay: 100ms
  http-timeout: 2s
  auto-start: true
  monitor-url: http://localhost:8080
  supervisor-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
