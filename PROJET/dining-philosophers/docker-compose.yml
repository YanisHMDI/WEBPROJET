# Lancement :  MODE=TOKEN docker compose up --build
#   MODE       : SPOILED (partie 1) | NAIVE_SUPERVISOR (partie 2) | PAIR_SUPERVISOR (3.1 / 3.2) | TOKEN (3.3) | ZOOKEEPER (3.4)
#   PAIR_MODE  : UNSAFE (3.1) | LOCKED (3.2)
#   RACE_WINDOW: pause entre "vérifier" et "réserver" côté superviseur (ex : 20ms) pour voir les bugs
#   DETECT_CONFLICTS : mettre false en partie 1 (les voisins ont le droit de manger ensemble)
#   ASSIGNMENT : TOKEN et ZOOKEEPER — RANDOM (F_i + une fourchette quelconque) | NEIGHBOURS (F_i, F_i+1)
#   DROP_RATE / MAX_DELAY : TOKEN uniquement — injection de pannes réseau (ex : 0.2 et 50ms)
#   EVENTS     : KAFKA (défaut ici, partie 6) | HTTP
#
# Adresses :
#   tableau de bord  http://localhost:8080
#   Prometheus       http://localhost:9090   (métriques et alertes)
#   Grafana          http://localhost:3000   (tableau « Dîner des philosophes », sans mot de passe)

x-java-service: &java-service
  restart: unless-stopped           # gestion des pannes : un service qui plante est relancé
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-philosopher: &philosopher
  <<: *java-service
  build:
    context: .
    args:
      MODULE: philosopher-service
  image: philo/philosopher-service
  depends_on:
    monitor: { condition: service_started }
    supervisor: { condition: service_started }
    zookeeper: { condition: service_started }
    kafka: { condition: service_healthy }

x-philo-env: &philo-env
  PHILO_COUNT: 5
  PHILO_MODE: ${MODE:-SPOILED}
  PHILO_EVENTS: ${EVENTS:-KAFKA}
  PHILO_MONITOR_URL: http://monitor:8080
  PHILO_SUPERVISOR_URL: http://supervisor:8081
  PHILO_PEERS: http://philo-0:8090,http://philo-1:8090,http://philo-2:8090,http://philo-3:8090,http://philo-4:8090
  PHILO_ASSIGNMENT: ${ASSIGNMENT:-RANDOM}
  PHILO_TOKEN_DROP_RATE: ${DROP_RATE:-0}
  PHILO_TOKEN_MAX_DELAY: ${MAX_DELAY:-0ms}
  PHILO_ZOOKEEPER_CONNECT: zookeeper:2181
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # ---------------------------------------------------------------- infrastructure
  # partie 6 : bus d'événements (mode KRaft, sans ZooKeeper)
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # partie 3.4 : coordination distribuée (utilisé seulement en MODE=ZOOKEEPER)
  zookeeper:
    image: zookeeper:3.9
    restart: unless-stopped
    ports: ["2181:2181"]

  # partie 6 : supervision
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---------------------------------------------------------------- microservices
  monitor:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: monitor-service
    image: philo/monitor-service
    ports: ["8080:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      MONITOR_PHILOSOPHERS: 5
      MONITOR_DETECT_NEIGHBOUR_CONFLICTS: ${DETECT_CONFLICTS:-true}
      MONITOR_KAFKA_ENABLED: "true"
      MONITOR_PHILOSOPHER_URLS: http://philo-0:8090,http://philo-1:8090,http://philo-2:8090,http://philo-3:8090,http://philo-4:8090
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  supervisor:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: supervisor-service
    image: philo/supervisor-service
    ports: ["8081:8081"]
    environment:
      SUPERVISOR_FORKS: 5
      SUPERVISOR_PAIR_MODE: ${PAIR_MODE:-LOCKED}
      SUPERVISOR_RACE_WINDOW: ${RACE_WINDOW:-0ms}

  philo-0:
    <<: *philosopher
    ports: ["8090:8090"]
    environment: { <<: *philo-env, PHILO_ID: 0 }
  philo-1:
    <<: *philosopher
    ports: ["8091:8090"]
    environment: { <<: *philo-env, PHILO_ID: 1 }
  philo-2:
    <<: *philosopher
    ports: ["8092:8090"]
    environment: { <<: *philo-env, PHILO_ID: 2 }
  philo-3:
    <<: *philosopher
    ports: ["8093:8090"]
    environment: { <<: *philo-env, PHILO_ID: 3 }
  philo-4:
    <<: *philosopher
    ports: ["8094:8090"]
    environment: { <<: *philo-env, PHILO_ID: 4 }
