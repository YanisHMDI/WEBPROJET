# Service « headless » : donne à chaque philosophe une adresse DNS stable, philosopher-<i>.philosophers
apiVersion: v1
kind: Service
metadata:
  name: philosophers
spec:
  clusterIP: None
  publishNotReadyAddresses: true    # les pairs doivent pouvoir se joindre pendant le démarrage
  selector: { app: philosopher }
  ports:
    - { name: http, port: 8090 }
---
# StatefulSet : chaque pod garde son numéro (philosopher-0 … philosopher-4), qui devient son identifiant
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: philosopher
spec:
  serviceName: philosophers
  replicas: 5                       # doit valoir PHILO_COUNT
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: philosopher }
  template:
    metadata:
      labels: { app: philosopher }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: philosopher
          image: philo/philosopher-service
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef: { name: philo-config }
          env:
            # identifiant = numéro du pod dans le StatefulSet (étiquette posée par Kubernetes ≥ 1.28)
            - name: PHILO_ID
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']" }
          # gestion des pannes : Kubernetes redémarre le conteneur si la JVM ne répond plus (liveness)
          # et ne lui envoie du trafic que lorsqu'il est prêt (readiness)
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
