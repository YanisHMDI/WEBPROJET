apiVersion: v1
kind: Service
metadata:
  name: monitor
spec:
  selector: { app: monitor }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: monitor }
  template:
    metadata:
      labels: { app: monitor }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: monitor
          image: philo/monitor-service
          ports:
            - containerPort: 8080
          env:
            - name: MONITOR_PHILOSOPHERS
              valueFrom: { configMapKeyRef: { name: philo-config, key: PHILO_COUNT } }
            - name: MONITOR_PHILOSOPHER_URLS
              valueFrom: { configMapKeyRef: { name: philo-config, key: PHILO_PEERS } }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: philo-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS } }
            - { name: MONITOR_KAFKA_ENABLED, value: "true" }
          # gestion des pannes : Kubernetes redémarre le conteneur si la JVM ne répond plus (liveness)
          # et ne lui envoie du trafic que lorsqu'il est prêt (readiness)
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
